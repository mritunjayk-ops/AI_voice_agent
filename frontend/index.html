<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Voice Agent</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="status-pill"
         aria-live="polite">

        <span id="statusDot"
              class="status-dot ready"></span>

        <span id="status">
            Ready
        </span>

    </div>

    <main class="container"
          aria-label="Voice assistant">

        <h1>
            AI Voice Agent
        </h1>

        <button id="micButton"
                type="button">
            <svg class="mic-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <path d="M12 14.5c1.7 0 3-1.3 3-3V6c0-1.7-1.3-3-3-3S9 4.3 9 6v5.5c0 1.7 1.3 3 3 3Z"></path>
                <path d="M6.5 10.5v1A5.5 5.5 0 0 0 12 17a5.5 5.5 0 0 0 5.5-5.5v-1"></path>
                <path d="M12 17v4"></path>
                <path d="M8.5 21h7"></path>
            </svg>
        </button>

        <button id="stopSpeakingButton"
                type="button"
                disabled>
            Stop Speaking
        </button>

        <div class="instructions">

            Hold the mic button while speaking.<br>
            Release it when finished.

        </div>

    </main>

    <aside class="conversation-panel"
           aria-label="Conversation history">

        <div class="conversation-title">
            Conversation
        </div>

        <div id="chatMessages"
             class="chat-messages"
             aria-live="polite">

            <div id="emptyConversation"
                 class="empty-state">
                Recent voice messages will appear here.
            </div>

        </div>

    </aside>

    <script src="script.js"></script>

</body>

</html>
